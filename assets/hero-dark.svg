<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-label="Boris, native iOS developer. An Xcode editor window declares a SwiftUI view next to a preview canvas listing the apps WorkoutTracker, FoodTracker and Stepper.">
  <title>Boris &#8212; Native iOS Developer</title>
  <defs>
    <clipPath id="window">
      <rect x="1" y="1" width="1198" height="418" rx="16"/>
    </clipPath>
  </defs>

  <g clip-path="url(#window)">
    <rect x="0" y="0" width="1200" height="420" fill="#1F1F24"/>
    <rect x="712" y="48" width="488" height="372" fill="#1B1B1F"/>
    <rect x="712" y="48" width="1" height="372" fill="#3B3B41"/>

    <rect x="0" y="0" width="1200" height="48" fill="#292A30"/>
    <rect x="0" y="47" width="1200" height="1" fill="#3B3B41"/>
    <circle cx="28" cy="24" r="7" fill="#FF5F57"/>
    <circle cx="52" cy="24" r="7" fill="#FEBC2E"/>
    <circle cx="76" cy="24" r="7" fill="#28C840"/>
    <rect x="100" y="13" width="22" height="22" rx="6" fill="#F05138"/>
    <path d="M107 18.5 L113 24 L107 29.5" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="134" y="31" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" fill="#DFDFE0">Boris.swift</text>
    <text x="1176" y="31" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" fill="#8E8E93">iOS &#183; Swift &#183; SwiftUI</text>

    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" fill="#4C4C52" text-anchor="end">
      <text x="48" y="114">1</text>
      <text x="48" y="147">2</text>
      <text x="48" y="180">3</text>
      <text x="48" y="213">4</text>
      <text x="48" y="246">5</text>
      <text x="48" y="279">6</text>
      <text x="48" y="312">7</text>
      <text x="48" y="345">8</text>
      <text x="48" y="378">9</text>
    </g>

    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="26" fill="#DFDFE0">
      <text x="76" y="114"><tspan fill="#FF7AB2">struct</tspan> <tspan fill="#6BDFFF">Boris</tspan>: <tspan fill="#6BDFFF">View</tspan> {</text>
      <text x="138" y="147"><tspan fill="#FF7AB2">let</tspan> role = <tspan fill="#FF8170">"Native iOS Developer"</tspan></text>
      <text x="138" y="180"><tspan fill="#FF7AB2">let</tspan> base = <tspan fill="#FF8170">"Minsk, BSUIR"</tspan></text>
      <text x="138" y="213"><tspan fill="#FF7AB2">let</tspan> stack = [.swiftUI, .swiftData]</text>
      <text x="138" y="279"><tspan fill="#FF7AB2">var</tspan> body: <tspan fill="#FF7AB2">some</tspan> <tspan fill="#6BDFFF">View</tspan> {</text>
      <text x="201" y="312"><tspan fill="#6BDFFF">Portfolio</tspan>(shipping: .apps)</text>
      <text x="138" y="345">}</text>
      <text x="76" y="378">}</text>
    </g>

    <text x="736" y="74" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" letter-spacing="1.6" fill="#8E8E93">PREVIEW</text>

    <rect x="816" y="92" width="280" height="304" rx="34" fill="#1F1F24" stroke="#48484E"/>
    <rect x="912" y="106" width="88" height="12" rx="6" fill="#000000"/>

    <circle cx="956" cy="160" r="32" fill="#F05138"/>
    <text x="956" y="172" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="32" font-weight="600" fill="#FFFFFF">B</text>

    <text x="956" y="222" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="30" font-weight="600" fill="#DFDFE0">Boris</text>
    <text x="956" y="248" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" fill="#8E8E93">Native iOS Developer</text>
    <rect x="836" y="266" width="240" height="1" fill="#3B3B41"/>

    <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" fill="#DFDFE0">
      <rect x="836" y="280" width="240" height="30" rx="8" fill="#2C2C31"/>
      <rect x="848" y="291" width="8" height="8" rx="2" fill="#F05138"/>
      <text x="868" y="301">WorkoutTracker</text>

      <rect x="836" y="318" width="240" height="30" rx="8" fill="#2C2C31"/>
      <rect x="848" y="329" width="8" height="8" rx="2" fill="#F05138"/>
      <text x="868" y="339">FoodTracker</text>

      <rect x="836" y="356" width="240" height="30" rx="8" fill="#2C2C31"/>
      <rect x="848" y="367" width="8" height="8" rx="2" fill="#F05138"/>
      <text x="868" y="377">Stepper</text>
    </g>
  </g>

  <rect x="1" y="1" width="1198" height="418" rx="16" fill="none" stroke="#3B3B41"/>
</svg>
