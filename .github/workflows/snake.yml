name: Snake

# Turns the contribution calendar into an animated SVG and publishes it to the
# output branch, keeping generated art out of the main branch history.

on:
  schedule:
    # Align with Cards cadence so the snake does not lag a full day behind.
    - cron: "45 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: snake
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Generate contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#F05138
            dist/github-snake-light.svg?palette=github-light&color_snake=#F05138

      - name: Publish to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
