name: Cards

# Regenerates the SVG cards in assets/ and commits them. Rendering happens here
# rather than through a hosted badge service so the profile cannot be broken by
# somebody else's rate limit.

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - ".github/workflows/cards.yml"

permissions:
  contents: write

concurrency:
  group: cards
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Render static assets
        run: python3 scripts/build_static.py

      - name: Render data cards
        run: python3 scripts/build_cards.py
        env:
          GH_STATS_TOKEN: ${{ secrets.GH_STATS_TOKEN }}

      - name: Commit refreshed cards
        run: |
          if [ -z "$(git status --porcelain -- assets)" ]; then
            echo "cards unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets
          git commit -m "chore: refresh profile cards"
          git push
